[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2-ragbench-rag"
version = "0.1.0"
description = "Auditable local-first RAG pipeline for T2-RAGBench"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faiss-cpu>=1.9,<2",
  "gradio>=6,<7",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pdfplumber>=0.11,<1",
  "Pillow>=10,<13",
  "pypdf>=6,<7",
  "pypdfium2>=4.30,<5",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "rapidfuzz>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
sentence-transformers = [
  "sentence-transformers>=3.3,<6",
]

[project.scripts]
t2rag = "t2rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
